# buf.gen.yaml
version: v2
clean: true
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-es
    out: src/gen
    opt:
      - target=ts
      - import_extension=.js
      - ts_nocheck=false
      # Use the validate.proto artifacts exported by @bufbuild/protovalidate
      # instead of generating a local copy.
      - rewrite_imports=./buf/validate/*_pb.js:@bufbuild/protovalidate/gen