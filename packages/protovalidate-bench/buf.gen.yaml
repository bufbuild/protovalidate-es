# buf.gen.yaml
version: v2
clean: true
inputs:
  - directory: proto
plugins:
  # You will need to adapt these values to your environment:
  # https://protobufes.com/reference/environments/
  - local: protoc-gen-es
    out: src/gen
    opt:
      - target=ts
      - import_extension=js
      - ts_nocheck=false
      # Use the validate.proto artifacts exported by @bufbuild/protovalidate
      # instead of generating a local copy.
      - map_imports=buf/validate/:@bufbuild/protovalidate/gen