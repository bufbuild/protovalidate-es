# buf.gen.yaml
version: v2
inputs:
  - directory: proto
# Deletes the directories specified in the `out` field for all plugins before running code generation.
clean: true
plugins:
  # The local plugin is installed with `npm install @bufbuild/protoc-gen-es`.
  - local: protoc-gen-es
    opt:
      - target=ts
      # This option enables Valid types
      - valid_types=protovalidate_required+legacy_required
      # Use the validate.proto artifacts exported by @bufbuild/protovalidate
      # instead of generating a local copy. This requires @bufbuild/protobuf
      # v2.14.1 or later.
      - rewrite_imports=./buf/validate/*_pb.js:@bufbuild/protovalidate/gen
    out: src/gen
