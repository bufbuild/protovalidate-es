# buf.gen.yaml
version: v2
clean: true
inputs:
  - directory: proto
plugins:
  # You will need to adapt these values to your environment:
  # https://protobufes.com/reference/environments/
  - local: protoc-gen-es
    out: src/gen
    include_imports: true
    opt:
      - target=ts
      - import_extension=js
      - ts_nocheck=false
