version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      timezone: UTC
      time: "07:00"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      timezone: UTC
      time: "07:00"
    open-pull-requests-limit: 50
    ignore:
      # TypeScript 7 removes node10 module resolution, which the CJS build
      # relies on.
      - dependency-name: "typescript"
        versions: ["7.x"]
    groups:
      mostly-harmless:
        patterns:
          - "typescript"
          - "tsx"
          - "@bufbuild/buf"
          - "@bufbuild/license-header"
          - "@types/node"
      lint-and-format:
        patterns:
          - "biome"
          - "@bufbuild/license-header"
          - "@arethetypeswrong/cli"
      protobuf-es:
        patterns:
          - "@bufbuild/protobuf"
          - "@bufbuild/protoplugin"
          - "@bufbuild/protoc-gen-es"
